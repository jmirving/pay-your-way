name: sealed-pipeline-v3

on:
  push:
    branches:
      - benchmark/public-retrospective-v1
    paths:
      - .github/workflows/sealed-pipeline-v3.yml
      - training/leakdb_pipeline_acquire_v3.py
      - training/leakdb_pipeline_predict_v3.py
      - training/leakdb_pipeline_score.py
      - training/leakdb/pipeline_002_prediction_freeze.json
      - training/leakdb/pipeline_002_score.json

jobs:
  prepare-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install "water-benchmark-hub==0.4.0" "scikit-learn>=1.5,<2"
      - name: Prepare frozen-policy replication cohort
        run: python training/leakdb_pipeline_acquire_v3.py --out-dir pipeline_v3_work --holdout-count 100 --challenge-id leakdb-net1-pipeline-003
      - name: Run frozen pipeline-002 policy
        run: python training/leakdb_pipeline_predict_v3.py --out-dir pipeline_v3_work
      - name: Capture environment
        run: python -m pip freeze > pipeline_v3_work/public/environment.txt
      - name: Upload pipeline-v3 predictions
        uses: actions/upload-artifact@v4
        with:
          name: sealed-pipeline-v3-predictions
          path: pipeline_v3_work/public/
          if-no-files-found: error
          retention-days: 30
      - name: Upload withheld pipeline-v3 labels
        uses: actions/upload-artifact@v4
        with:
          name: sealed-pipeline-v3-labels
          path: pipeline_v3_work/secret/pipeline_labels.json
          if-no-files-found: error
          retention-days: 30
