name: sealed-localization

on:
  push:
    branches:
      - benchmark/public-retrospective-v1
    paths:
      - .github/workflows/sealed-localization.yml
      - training/leakdb_localize_acquire.py
      - training/leakdb_localize_predict.py
      - training/leakdb_localize_score.py

jobs:
  prepare-and-localize:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install "water-benchmark-hub==0.4.0" "scikit-learn>=1.5,<2"
      - name: Prepare sealed localization challenge 001
        run: python training/leakdb_localize_acquire.py --out-dir localization_work --holdout-count 50 --burned-through 5 --challenge-id leakdb-net1-localize-001
      - name: Fit coordinate localizer and rank sealed candidate nodes
        run: python training/leakdb_localize_predict.py --out-dir localization_work
      - name: Capture environment
        run: python -m pip freeze > localization_work/public/environment.txt
      - name: Upload localization predictions
        uses: actions/upload-artifact@v4
        with:
          name: sealed-localization-predictions
          path: localization_work/public/
          if-no-files-found: error
          retention-days: 30
      - name: Upload withheld localization labels
        uses: actions/upload-artifact@v4
        with:
          name: sealed-localization-labels
          path: localization_work/secret/location_labels.json
          if-no-files-found: error
          retention-days: 30
