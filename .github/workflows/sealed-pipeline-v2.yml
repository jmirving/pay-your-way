name: sealed-pipeline-v2

on:
  push:
    branches:
      - benchmark/public-retrospective-v1
    paths:
      - .github/workflows/sealed-pipeline-v2.yml
      - training/leakdb_pipeline_acquire_v2.py
      - training/leakdb_pipeline_predict_v2.py
      - training/leakdb_pipeline_score.py
      - training/leakdb/pipeline_001_prediction_freeze.json
      - training/leakdb/pipeline_001_score.json

jobs:
  prepare-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install "water-benchmark-hub==0.4.0" "scikit-learn>=1.5,<2"
      - name: Prepare sealed end-to-end pipeline challenge 002
        run: python training/leakdb_pipeline_acquire_v2.py --out-dir pipeline_v2_work --holdout-count 80 --challenge-id leakdb-net1-pipeline-002
      - name: Calibrate new-alert policy and predict sealed scenarios
        run: python training/leakdb_pipeline_predict_v2.py --out-dir pipeline_v2_work
      - name: Capture environment
        run: python -m pip freeze > pipeline_v2_work/public/environment.txt
      - name: Upload pipeline-v2 predictions
        uses: actions/upload-artifact@v4
        with:
          name: sealed-pipeline-v2-predictions
          path: pipeline_v2_work/public/
          if-no-files-found: error
          retention-days: 30
      - name: Upload withheld pipeline-v2 labels
        uses: actions/upload-artifact@v4
        with:
          name: sealed-pipeline-v2-labels
          path: pipeline_v2_work/secret/pipeline_labels.json
          if-no-files-found: error
          retention-days: 30
