name: sealed-hanoi-pipeline-v5

on:
  push:
    branches:
      - benchmark/public-retrospective-v1
    paths:
      - .github/workflows/sealed-hanoi-pipeline-v5.yml
      - training/leakdb_hanoi_acquire_v5.py
      - training/leakdb_hanoi_predict_v5.py
      - training/leakdb/hanoi_004_prediction_freeze.json
      - training/leakdb/hanoi_004_score.json

jobs:
  prepare-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install "water-benchmark-hub==0.4.0" "scikit-learn>=1.5,<2"
      - name: Prepare sealed Hanoi four-hour refresh challenge
        run: python training/leakdb_hanoi_acquire_v5.py --out-dir hanoi_v5_work --holdout-count 80 --challenge-id leakdb-hanoi-pipeline-005
      - name: Run four-hour dynamic localization
        run: python training/leakdb_hanoi_predict_v5.py --out-dir hanoi_v5_work
      - name: Capture environment
        run: python -m pip freeze > hanoi_v5_work/public/environment.txt
      - name: Upload Hanoi-v5 predictions
        uses: actions/upload-artifact@v4
        with:
          name: sealed-hanoi-v5-predictions
          path: hanoi_v5_work/public/
          if-no-files-found: error
          retention-days: 30
      - name: Upload withheld Hanoi-v5 labels
        uses: actions/upload-artifact@v4
        with:
          name: sealed-hanoi-v5-labels
          path: hanoi_v5_work/secret/pipeline_labels.json
          if-no-files-found: error
          retention-days: 30
