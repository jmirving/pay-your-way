name: sealed-leakdb

on:
  push:
    branches:
      - benchmark/public-retrospective-v1
    paths:
      - .github/workflows/sealed-leakdb.yml
      - training/leakdb_sealed.py
      - training/leakdb/**

jobs:
  prepare-and-predict:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install benchmark dependencies
        run: python -m pip install "water-benchmark-hub==0.4.0" "scikit-learn>=1.5,<2"
      - name: Prepare sealed LeakDB challenge
        run: python training/leakdb_sealed.py prepare --out-dir challenge_work --dev-count 20 --holdout-count 20
      - name: Fit development model and predict sealed scenarios
        run: python training/leakdb_sealed.py predict --out-dir challenge_work
      - name: Capture environment
        run: python -m pip freeze > challenge_work/public/environment.txt
      - name: Upload prediction artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealed-leakdb-predictions
          path: challenge_work/public/
          if-no-files-found: error
          retention-days: 30
      - name: Upload withheld label artifact
        uses: actions/upload-artifact@v4
        with:
          name: sealed-leakdb-labels
          path: challenge_work/secret/labels.npz
          if-no-files-found: error
          retention-days: 30
